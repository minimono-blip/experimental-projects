<title>MyTunes</title>
<script id="theme-boot">/* apply the saved theme before first paint (mirrored from settings into localStorage) */
(function () { try {
  var t = localStorage.getItem('mp3lib.theme') || 'dark';
  if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
} catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); } })();
</script>

html{color-scheme:var(--cscheme);scrollbar-color:var(--sb)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:inherit}
svg{width:18px;height:18px;fill:currentColor;flex:none}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px;margin-right:auto}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2nd));font-size:17px;color:var(--on-accent)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;position:relative}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--hover-line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover:not(:disabled){background:var(--hover2);color:var(--text)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn.sm svg{width:16px;height:16px}
.progress{padding:10px 20px;background:var(--progress-bg);border-bottom:1px solid var(--line)}
.progress-text{font-size:13px;color:var(--accent2);margin-bottom:6px}
.progress-track{height:6px;background:var(--progress-track);border-radius:6px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2nd));transition:width .15s}
.banner{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--banner-bg);border-bottom:1px solid var(--banner-line);color:var(--banner-text);flex-wrap:wrap}
.banner .msg{flex:1;min-width:240px}
.layout{flex:1;display:flex;min-height:0}
.sidebar{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:12px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.side-h button{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px;display:grid;place-items:center}
.side-h button:hover{background:var(--hover2);color:var(--text)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--muted);text-align:left}
.nav:hover{background:var(--nav-hover);color:var(--text)}
.nav.active{background:var(--nav-active);color:var(--nav-active-text)}
.nav .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-size:12px;color:var(--dim)}
.side-stats{margin:16px 10px 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.main{flex:1;overflow-y:auto;padding:22px 26px calc(var(--player-h) + 30px);min-width:0}

      if (t.autorateResult !== 'none' || t.rating) {          // handled before (or rated since): just note the new rule
        if (!t.autorateResult) t.autorateResult = 'legacy';

    const [tracks, albums, metas] = await Promise.all([DB.all('tracks'), DB.all('albums'), DB.all('meta')]);
    tracks.forEach(t => S.tracks.set(t.id, t));
    // migration: albums only keep track ids; any old per-album rating copy moves onto the track (once)
    const fixA = [], fixT = new Set();
    albums.forEach(a => { const n = normalizeAlbum(a); S.albums.set(n.album.id, n.album); if (n.dirty) fixA.push(n.album); n.legacy.forEach(t => fixT.add(t)); });
    tracks.forEach(t => { const r = clampRating(t.rating); if (r !== t.rating) { t.rating = r; fixT.add(t); } });
    if (fixA.length) await DB.putMany('albums', fixA);
    if (fixT.size) await DB.putMany('tracks', [...fixT]);
    // data v2: ratings are -5..+5. Existing 0..5 values mean the same thing, so they are kept as they are.
    const m = metas.find(x => x.key === 'meta'); if (m) Object.assign(S.meta, m);
    if (S.meta.ratingScale !== 2) { S.meta.ratingScale = 2; saveMeta(); }
  } catch (e) { console.error(e); toast('Could not load saved library: ' + e.message, 'error'); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  applyTheme(S.meta.theme || 'dark');
  const vol = $('#vol'); vol.value = S.meta.volume; audio.volume = +S.meta.volume; setRangeFill(vol); setRangeFill($('#seek'));
  Scope.sync();
  computeAuto(); renderAll();
}
init();
</script>
</body>
</html>
