`Airframe or ground tank. Only the tank's shell punches a pressure wave.`,help:`WASD move · Space fire · F transform. Air gets thrown. Ground stays planted.`,tip:`From wave 4 a hit only flashes the enemy white. Later waves soak more than one shot.`},{id:`missile`,index:`06`,name:`Missile Command`,year:`1980`,twist:`Shock`,blurb:`A near miss is not a miss. Shock rings shove warheads off the cities.`,help:`Aim with the pointer or arrows · click or Space to launch.`,tip:`Deflect into the dead ground between cities. Don't curve one into a skyline.`},{id:`defender`,index:`07`,name:`Defender`,year:`1981`,twist:`Rescue`,blurb:`Ten people on a looping ridge. A lander that reaches the top comes back as a mutant.`,help:`A/D thrust · W/S altitude · Space fire · X smart bomb · Q hyperspace.`,tip:`Catch a falling human and set them down. Laser a pod and it spills swarmers. The bomb does not.`},{id:`centipede`,index:`08`,name:`Centipede`,year:`1981`,twist:`Drift`,blurb:`The centipede still drops through the mushroom field. Your shot no longer flies straight.`,help:`WASD in the garden · Space fires up. Poisoned mushrooms make a head dive.`,tip:`A blast bends the next shot. Open a column, then let the wind finish it.`},{id:`cresta`,index:`09`,name:`Moon Cresta`,year:`1980`,twist:`Dock`,blurb:`Three hulls. After the fourth and eighth waves, fly your ship down onto the next stage.`,help:`A/D move · Space fire. On a dock, you steer the ship that is descending. W slows the drop, S speeds it.`,tip:`One shot in flight for stage 1, two for stage 2 or 3. Docked ships add those guns. The next hull appears after a lost stage.`},{id:`gravitar`,index:`10`,name:`Gravitar`,year:`1982`,twist:`Gravity`,blurb:`Four worlds, a red reactor, and a star that pulls. Thrust and shots still shove the air.`,help:`A/D rotate · W thrust · Space fire · X tractor and shield. Thrust and the beam burn fuel.`,tip:`Clear the four worlds, or the red planet's reactor, before the star takes you. Shots light hidden ground.`},{id:`raid`,index:`11`,name:`Star Raid`,year:`1983`,twist:`Port`,blurb:`Fighters, then the guns on the hull, then the trench. The port is a small hole at the end.`,help:`A/D slide · W/S in open space · Space fire. The trench only slides left and right.`,tip:`A burst knocks the next bolt into another lane. Save the center shot for the port.`},{id:`tempest`,index:`12`,name:`Tempest`,year:`1981`,twist:`Rim`,blurb:`Sixteen tunnels, then the colours change. Wind still shoves a shot into the next lane.`,help:`Move the mouse left or right to spin. Faster mouse, faster claw. Click fires · Space superzapper, twice a level.`,tip:`Spikes stay after a spiker dies. Clear them before the dive, or switch lanes.`},{id:`joust`,index:`13`,name:`Joust`,year:`1982`,twist:`Lift`,blurb:`The bird still flaps. A kill throws a thermal, and the next knight can be lifted into your lance.`,help:`A/D fly · W or Space flap. Be above their lance when you meet.`,tip:`Flap through the puff of a kill. The rising air will put you on top.`},{id:`robotron`,index:`14`,name:`Robotron`,year:`1982`,twist:`Crowd`,blurb:`The pack still rushes you. A shot no longer stops at the first grunt.`,help:`WASD move · Space fires the way you last moved. Touch the last humans.`,tip:`Fire into the thick of them. The wake knocks the next row into your line.`},{id:`sinistar`,index:`15`,name:`Sinistar`,year:`1983`,twist:`Roar`,blurb:`Mine the rocks. Save thirteen crystals. When it wakes, the roar is a real shockwave.`,help:`A/D rotate · W thrust · Space fire · X bomb once you have thirteen crystals.`,tip:`A shattered rock throws its crystal. Catch the drift, then bomb the mouth.`},{id:`galaga`,index:`16`,name:`Galaga`,year:`1981`,twist:`Dive`,blurb:`The formation still peels off. Their dive bends in the air your shots leave behind.`,help:`A/D move · Space fire. A boss can capture you. Shoot that boss to fly dual.`,tip:`Leave a wake in the dive path. The next ship will curve into it.`},{id:`berzerk`,index:`17`,name:`Berzerk`,year:`1980`,twist:`Maze`,blurb:`Robots still hunt the maze. A blast blows them into the walls they were using as cover.`,help:`WASD move · Space fires the way you face. Step through a wall gap to leave.`,tip:`Shoot a cluster, not a corner. The air finishes the ones the wall doesn't.`},{id:`forty`,index:`18`,name:`1942`,year:`1984`,twist:`Loop`,blurb:`The formation still comes down the screen. The loop is a thermal you can climb.`,help:`WASD fly · Space fire · X loop. The loop shrugs off a volley and throws air upward.`,tip:`Loop through your own blast. The column carries you over the next formation.`},{id:`bosconian`,index:`19`,name:`Bosconian`,year:`1981`,twist:`Radar`,blurb:`A wide starfield of armed stations. The core is one shot. Strip the cannons if you can't line it up.`,help:`A/D rotate · W thrust · S brake · Space fires the way you face. The radar is the whole map.`,tip:`A station blast throws the next fighter off your nose. Don't let the spy reach the edge.`}];function u(e){return l.find(t=>t.id===e)??l[1]}function d(){return{mode:`menu`,game:`asteroids`,score:0,best:0,scores:[],lives:3,wave:1,chain:0,status:``,pips:3,pipsLabel:`LIVES`,banner:``,pressure:0,muted:!1,selection:`asteroids`,glError:``,fluid:``,display:``}}var f=`data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjEuMTAwAAAAAAAAAAAAAAD/83DAAAAAAAAAAAAAWGluZwAAAA8AAAAKAAAJKQA2NjY2NjY2NjZYWFhYWFhYWFhYgICAgICAgICAgKKioqKioqKioqLExMTExMTExMTE2NjY2NjY2NjY2Obm5ubm5ubm5ubx8fHx8fHx8fHx/f39/f39/f39/f////////////8AAAAATGF2YzYxLjMuAAAAAAAAAAAAAAAAJAKrAAAAAAAACSkIXCWsAAAAAAAAAAAAAAAAAP/zoMQAEHgCkj9AAACAAKSGgJZvg/EBwSHAfeCAPvKBgoGJd4P8u8QOJhjl3xPD8uHxGHyjv/8o7gg74gd5Q5z//zhQMfyjv/EHh8u+uD6MgwBUUAOCIgCEsDAMPGwJgghDAQ571wCmI/ag6YJg1IhANlzuCzBACRWiCVdjLMSFI1AVdG3UhMLvGUAlY1xQZo67wY48jNY4ziBPYUrgHYWSVIiJXgtppbT7b6PwX8HAg4prDOTHBcONobvTbmJY/cxDkHr/chu0RecQjF5Y+6EC12uwNNv5ebSJy93JZnwLAP6/MzA81LJiD3gbamlbHaXb6vLXt143L+4c7r7G5ZGIg3Rh0SZ3GIvP2s7ruBc1Ml+7sPYu6jo4VqvDcvu38L+H0nOxixnz/st9juio+U+VjP6PCes
