<title>Elemental</title>
<style>

    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { overflow: hidden; }
  button { font: inherit; color: inherit; }
  button, [role="button"] { cursor: pointer; }

  #view { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; display: block; touch-action: none; }
  #drop {
    display: none;
    pointer-events: none;
    position: absolute;
    inset: 0;
    z-index: 2;
    align-items: center;
    justify-content: center;
    background: rgba(8, 18, 38, 0.75);
  }
  #app.dragover #drop { display: flex; }
  #drop p { margin: 0; background: var(--surface); border-radius: 12px; padding: 0.75rem 1rem; font-size: 1.25rem; }

    pointer-events: none;
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
  .card { background: var(--surface); border-radius: 12px; }
  header.card { padding: 0.75rem 1rem; }
  h1 { font-family: var(--display); font-size: 1.75rem; line-height: 1.1; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  #hint { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.875rem; }
  .stats { padding: 0.5rem 0.75rem; text-align: right; }
  .stats p { margin: 0; font-family: var(--mono); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  #fps { color: var(--muted); }
  #dims { color: var(--subtle); }

    pointer-events: auto;
    margin: 0 auto;
    width: 100%;
    max-width: 64rem;
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.5rem;
    border-radius: 20px;
    background: rgb(26 24 20 / 58%);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);

  .dock-main {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;

    align-items: center;
    gap: 0.5rem;
    height: 2.75rem;
    padding: 0 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);

    font-size: 0.875rem;
    font-weight: 500;

  .swatch { width: 0.75rem; height: 0.75rem; border-radius: 2px; display: inline-block; }
  .brush {

    align-items: center;
    gap: 0.75rem;
    height: 2.75rem;
    min-width: 12rem;
    flex: 1;
    padding: 0 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);

    color: var(--muted);
    font-size: 0.875rem;

    user-select: auto;
    touch-action: manipulation;
    background: transparent;
    height: 2.75rem;
    width: 100%;
    min-width: 0;
    flex: 1;
    margin: 0;
    cursor: pointer;

  #brush::-webkit-slider-thumb, #size::-webkit-slider-thumb {

  #brush::-moz-range-track, #size::-moz-range-track { height: 2px; background: var(--border); border-radius: 999px; }
  #brush::-moz-range-thumb, #size::-moz-range-thumb {

  #brush-n, #size-n { width: 1.5rem; color: var(--fg); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .air-range {
    -webkit-appearance: none;
    appearance: none;
    color-scheme: light;
    height: 1.25rem;
    margin: 0.15rem 0 0;
    background: transparent;
    cursor: pointer;
    --fill: 0%;

  .air-range::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right, #0a84ff var(--fill), #ffffff var(--fill));
  }
  .air-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 1rem;
    height: 1rem;
    margin-top: -0.375rem;
    border-radius: 999px;
    background: #ffffff;
    border: 2px solid #0a84ff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);

  .air-range::-moz-range-track {
    height: 4px;
    border: none;
    border-radius: 999px;
    background: #ffffff;
  }
  .air-range::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: #0a84ff;
  }
  .air-range::-moz-range-thumb {
    width: 1rem;
    height: 1rem;
    border-radius: 999px;
    background: #ffffff;
    border: 2px solid #0a84ff;
  }

  @keyframes dock-pop {
    from { opacity: 0; transform: translateY(6px); }

  .dock.is-min #export,
  .dock.is-min #minimize,
  .dock.is-min #speeds { display: none; }
  #tools, #shapes { position: relative; }
  .dock-menu {
    position: absolute;
    z-index: 20;
    left: 0;
    bottom: calc(100% + 0.4rem);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-width: max-content;
    padding: 0.4rem;
    border-radius: 12px;
    background: rgb(26 24 20 / 88%);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .dock-menu.is-down { bottom: auto; top: calc(100% + 0.4rem); }
  .dock-menu[hidden] { display: none !important; }
  #shapes { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .shape-btn { width: 2.75rem; justify-content: center; padding: 0; }
  .shape-btn svg { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  @media (prefers-reduced-motion: reduce) {
    .dock-btn:active { transform: none; }
    .dock.is-settling > * { animation: none; }
  }

</div>

		airNote.style.cssText = "margin:0;font-size:0.75rem;color:#b7ab9a;";
		airPanel.append(airNote);
		wrap.append(airPanel);
		window.addEventListener("keydown", (e) => {
			const tag = e.target?.tagName;
			if (tag === "INPUT" && e.target.type === "range" && e.code === "Space") {
				e.preventDefault();
				airPanel.style.display = airPanel.style.display === "none" ? "flex" : "none";
				return;
			}
			if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
			if (e.key === "1") setTool("sand");
			else if (e.key === "2") setTool("water");
			else if (e.key === "3") setTool("magma");
			else if (e.key === "4") setTool("wood");
			else if (e.key === "c" || e.key === "C") setTool("coal");
			else if (e.key === "5") setTool("concrete");
			else if (e.key === "6") setTool("erase");
			else if (e.key === "7") setTool("oil");
			else if (e.key === "8") setTool("gunpowder");
			else if (e.key === "9") setTool("seed");
			else if (e.key === "0") setTool("salt");
			else if (e.key === "f" || e.key === "F") setTool("fire");
			else if (e.key === "[") {
				radius = Math.max(0, radius - 1);
				size.value = String(radius);
				sizeN.textContent = String(radius + 1);
			} else if (e.key === "]") {
				radius = Math.min(24, radius + 1);
				size.value = String(radius);
				sizeN.textContent = String(radius + 1);
			} else if (e.key === "-" || e.key === "_") {
				thick = Math.max(0, thick - 1);
				brush.value = String(thick);
				brushN.textContent = String(thick + 1);
			} else if (e.key === "=" || e.key === "+") {
				thick = Math.min(12, thick + 1);
				brush.value = String(thick);
				brushN.textContent = String(thick + 1);
			} else if (e.code === "KeyP") {
				e.preventDefault();
				setPaused(!paused);
			} else if (e.code === "Space") {
				e.preventDefault();
				airPanel.style.display = airPanel.style.display === "none" ? "flex" : "none";
			}
		});
		new ResizeObserver(() => fit(true)).observe(wrap);
		window.addEventListener("pagehide", () => {
			cancelAnimationFrame(raf);
			renderer.destroy();
		});
	}
	boot();
	//#endregion
})();

</script>
</body>
</html>
